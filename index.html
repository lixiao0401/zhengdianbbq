<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>整点烧烤 - 在线点餐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Microsoft YaHei',sans-serif;background:#f5e6d3;min-height:100vh;padding-bottom:80px}
.header{background:linear-gradient(135deg,#e85d00,#cc3300);padding:20px 16px 16px;text-align:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.header .brand{font-size:26px;font-weight:900;color:#fff;letter-spacing:3px}
.header .slogan{color:rgba(255,255,255,.85);font-size:12px;letter-spacing:2px;margin-top:2px}
.header .slogan .hot{color:#ffdd44}
.category{margin:10px 12px 6px}
.cat-header{display:flex;align-items:center;gap:8px;padding:8px 0 6px}
.cat-tag{background:linear-gradient(135deg,#e85d00,#cc3300);color:#fff;font-size:11px;font-weight:700;padding:2px 10px;border-radius:4px}
.cat-title{color:#8a4a2a;font-size:15px;font-weight:700}
.cat-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(200,120,60,.2),transparent)}
.menu-list{display:flex;flex-direction:column;gap:4px}
.menu-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#fffcf8;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.item-info .name{color:#4a2a1a;font-size:14px;font-weight:700}
.item-info .name .hot{color:#ff4400;font-size:12px;margin-right:2px}
.item-info .desc{color:#8a7a6a;font-size:11px;margin-top:1px}
.item-right{display:flex;align-items:center;gap:12px}
.item-price{color:#cc5500;font-size:16px;font-weight:900}
.item-price small{font-size:11px;font-weight:400;color:#996644}
.btn-group{display:flex;align-items:center;gap:6px}
.btn-minus,.btn-plus{width:28px;height:28px;border-radius:50%;border:none;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.btn-minus{background:#f0e0d0;color:#885533}
.btn-plus{background:linear-gradient(135deg,#e85d00,#cc3300);color:#fff;box-shadow:0 2px 6px rgba(200,50,0,.2)}
.item-count{color:#4a2a1a;font-size:15px;font-weight:700;min-width:20px;text-align:center}
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:#2a1a0a;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,.3)}
.cart-left{display:flex;align-items:center;gap:10px;cursor:pointer}
.cart-icon-wrap{position:relative;width:44px;height:44px;background:rgba(255,255,255,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.cart-badge{position:absolute;top:-4px;right:-4px;background:#ff4400;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px}
.cart-info .total-label{color:#aa8866;font-size:11px}
.cart-info .total-price{color:#ffaa44;font-size:20px;font-weight:900}
.cart-info .total-price small{font-size:12px;font-weight:400;color:#aa7744}
.btn-order{background:linear-gradient(135deg,#ff6a00,#ff4400);color:#fff;border:none;padding:10px 24px;border-radius:20px;font-size:15px;font-weight:700;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 12px rgba(255,50,0,.3)}
.btn-order:disabled{opacity:.4}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200}
.overlay.show{display:block}
.order-panel{position:fixed;bottom:0;left:0;right:0;max-height:60vh;background:#fffcf8;border-radius:20px 20px 0 0;z-index:201;transform:translateY(100%);transition:transform .3s ease;overflow-y:auto}
.order-panel.show{transform:translateY(0)}
.order-panel .handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:10px auto}
.order-panel .panel-title{text-align:center;font-size:16px;font-weight:700;color:#4a2a1a;padding-bottom:10px;border-bottom:1px solid #eee}
.order-list{padding:10px 16px}
.order-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5ede5}
.order-item .left .oname{color:#4a2a1a;font-size:14px;font-weight:700}
.order-item .left .oqty{color:#8a7a6a;font-size:12px}
.order-item .right{display:flex;align-items:center;gap:10px}
.order-item .right .oprice{color:#cc5500;font-size:14px;font-weight:700}
.order-total{display:flex;justify-content:space-between;padding:12px 16px 16px;border-top:1px solid #eee}
.order-total .tt{color:#4a2a1a;font-size:15px;font-weight:700}
.order-total .tp{color:#cc5500;font-size:20px;font-weight:900}
.order-total .tp small{font-size:12px;font-weight:400;color:#996644}
.panel-actions{display:flex;gap:10px;padding:0 16px 20px}
.panel-actions button{flex:1;padding:10px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.btn-clear{background:#f0e0d0;color:#885533}
.btn-submit{background:linear-gradient(135deg,#ff6a00,#ff4400);color:#fff}
.success-toast{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:16px;padding:30px 24px;text-align:center;z-index:202;box-shadow:0 20px 60px rgba(0,0,0,.3);min-width:280px}
.success-toast.show{display:block}
.success-toast .emoji{font-size:48px}
.success-toast .msg{color:#4a2a1a;font-size:16px;font-weight:700;margin-top:8px}
.success-toast .sub{color:#8a7a6a;font-size:13px;margin-top:4px}
.success-toast .btn-ok{margin-top:14px;background:linear-gradient(135deg,#e85d00,#cc3300);color:#fff;border:none;padding:8px 32px;border-radius:16px;font-size:14px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<div class="brand">🔥 整点烧烤</div>
<div class="slogan"><span class="hot">❗</span> 整点小烧烤 · 快乐没烦恼</div>
</div>
<div id="menuContainer"></div>
<div class="cart-bar">
<div class="cart-left" onclick="toggleCart()">
<div class="cart-icon-wrap">🛒<div class="cart-badge" id="cartBadge">0</div></div>
<div class="cart-info"><div class="total-label">合计</div><div class="total-price" id="cartTotal">0<small>元</small></div></div>
</div>
<button class="btn-order" id="btnOrder" onclick="submitOrder()" disabled>去下单</button>
</div>
<div class="overlay" id="overlay" onclick="toggleCart()"></div>
<div class="order-panel" id="orderPanel">
<div class="handle"></div>
<div class="panel-title">🛒 购物车</div>
<div class="order-list" id="orderList"></div>
<div class="order-total"><span class="tt">合计</span><span class="tp" id="panelTotal">0<small>元</small></span></div>
<div class="panel-actions"><button class="btn-clear" onclick="clearCart()">清空</button><button class="btn-submit" onclick="submitOrder()">提交订单</button></div>
</div>
<div class="success-toast" id="successToast">
<div class="emoji">🎉</div>
<div class="msg">订单已发送！</div>
<div class="sub">请加微信 15840015715 确认</div>
<button class="btn-ok" onclick="closeSuccess()">知道了</button>
</div>
<script>
var menuData=[
{cat:"🌟 招牌",items:[
{name:"❗尖椒虾滑",price:5,unit:"串",hot:true},
{name:"❗大油边",price:20,unit:"串",tag:"不定时有"}]},
{cat:"🥩 肉串",subtitle:"牛羊肉5串起",items:[
{name:"牛肉",price:2,unit:"串"},
{name:"羊肉",price:2,unit:"串"},
{name:"猪肉串",price:1,unit:"串"},
{name:"瘦牛",price:3,unit:"串"},
{name:"❗生筋",price:3,unit:"串"},
{name:"❗油边",price:5,unit:"串"},
{name:"❗排骨串",price:3,unit:"串"},
{name:"五花肉卷金针菇",price:3,unit:"串"}]},
{cat:"💰 2元区",subtitle:"实惠走量",items:[
{name:"菜卷(金针菇/香菜)",price:2,unit:"串"},
{name:"辣椒",price:2,unit:"串"},
{name:"鱼丸",price:2,unit:"串"},
{name:"鱼豆腐",price:2,unit:"串"},
{name:"实蛋",price:2,unit:"串"},
{name:"小腰",price:2,unit:"串"},
{name:"熟筋",price:2,unit:"串"},
{name:"板筋",price:2,unit:"串"},
{name:"面筋",price:2,unit:"串"},
{name:"鸡肉肠",price:2,unit:"串"},
{name:"鸡胗",price:2,unit:"串"}]},
{cat:"💰 3元区",subtitle:"人气必点",items:[
{name:"鸡皮",price:3,unit:"串"},
{name:"鸡脆骨",price:3,unit:"串"},
{name:"筋皮",price:3,unit:"串"},
{name:"棒🐟",price:3,unit:"串"},
{name:"蚂蚱",price:3,unit:"串"},
{name:"羊脖筋",price:3,unit:"串"},
{name:"粉肠",price:3,unit:"串"},
{name:"烤饼",price:3,unit:"串"},
{name:"面包片",price:3,unit:"串"}]},
{cat:"🥬 素菜",subtitle:"按把/按拍",items:[
{name:"韭菜",price:5,unit:"拍"},
{name:"玉米粒",price:5,unit:"把"},
{name:"豆皮",price:5,unit:"把"}]},
{cat:"💰 4元+",subtitle:"精品系列",items:[
{name:"心管",price:4,unit:"串"},
{name:"风干肠",price:4,unit:"串"},
{name:"宫后夹肉",price:4,unit:"串"},
{name:"鸡翅",price:8,unit:"串"}]}];
var cart={};
function renderMenu(){
var c=document.getElementById('menuContainer');c.innerHTML='';
menuData.forEach(function(cat){
var s=document.createElement('div');s.className='category';
var h='<div class="cat-header"><div class="cat-tag">'+cat.cat.split(' ')[0]+'</div><div class="cat-title">'+(cat.cat.split(' ').slice(1).join(' ')||cat.cat)+'</div>'+(cat.subtitle?'<span class="cat-title" style="font-size:11px;color:#887766;">'+cat.subtitle+'</span>':'')+'<div class="cat-line"></div></div><div class="menu-list">';
cat.items.forEach(function(it,i){
var k=cat.cat+'_'+i;
var cnt=cart[k]||0;
h+='<div class="menu-item"><div class="item-info"><div class="name">'+(it.hot?'<span class="hot">❗</span>':'')+it.name+(it.tag?'<span style="font-size:10px;color:#ff6633;border:1px solid rgba(255,102,51,0.3);padding:0 5px;border-radius:2px;margin-left:3px;">'+it.tag+'</span>':'')+'</div><div class="desc">'+it.price+'元/'+it.unit+'</div></div><div class="item-right"><div class="item-price">'+it.price+'<small>元</small></div><div class="btn-group"><button class="btn-minus" onclick="changeQty(\''+k+'\',-1)">−</button><span class="item-count" id="count_'+k+'">'+(cnt||'')+'</span><button class="btn-plus" onclick="changeQty(\''+k+'\',1)">+</button></div></div></div>';
});
s.innerHTML=h+'</div>';
c.appendChild(s);
});
}
function changeQty(k,d){var it=findItem(k);if(!it)return;var n=Math.max(0,(cart[k]||0)+d);if(n===0)delete cart[k];else cart[k]=n;updateUI(k);}
function findItem(k){var p=k.split('_');var ca=menuData.find(function(c){return c.cat===p[0];});return ca?ca.items[p[1]]:null;}
function updateUI(k){var el=document.getElementById('count_'+k);if(el)el.textContent=cart[k]||'';updateCartBar();updateOrderPanel();}
function updateCartBar(){var t=getTotal(),n=getCount();document.getElementById('cartTotal').innerHTML=t+'<small>元</small>';var b=document.getElementById('cartBadge');b.style.display=n>0?'flex':'none';b.textContent=n;document.getElementById('btnOrder').disabled=n===0;}
function getTotal(){var t=0;for(var k in cart){var it=findItem(k);if(it)t+=it.price*cart[k];}return t;}
function getCount(){var n=0;for(var k in cart)n+=cart[k];return n;}
function toggleCart(){var p=document.getElementById('orderPanel'),o=document.getElementById('overlay');if(p.classList.contains('show')){p.classList.remove('show');o.classList.remove('show');}else if(getCount()>0){p.classList.add('show');o.classList.add('show');updateOrderPanel();}}
function updateOrderPanel(){var l=document.getElementById('orderList');var t=getTotal();document.getElementById('panelTotal').innerHTML=t+'<small>元</small>';if(getCount()===0){l.innerHTML='<div style="text-align:center;padding:30px 0;color:#8a7a6a;font-size:14px;">购物车空空如也 🛒</div>';return;}var h='';for(var k in cart){var it=findItem(k);if(it)h+='<div class="order-item"><div class="left"><div class="oname">'+it.name+'</div><div class="oqty">'+cart[k]+it.unit+' × '+it.price+'元</div></div><div class="right"><div class="oprice">'+(it.price*cart[k])+'元</div><button class="btn-minus" onclick="changeQty(\''+k+'\',-1)">−</button></div></div>';}l.innerHTML=h;}
function clearCart(){var ks=Object.keys(cart);cart={};ks.forEach(function(k){updateUI(k);});toggleCart();}
function submitOrder(){if(getCount()===0)return;var m='🔥 新订单\n';m+='━━━━━━━━━━\n';for(var k in cart){var it=findItem(k);if(it)m+=it.name+' × '+cart[k]+' = '+(it.price*cart[k])+'元\n';}m+='━━━━━━━━━━\n';m+='💰 合计：'+getTotal()+'元\n';m+='📞 15840015715';navigator.clipboard.writeText(m).then(function(){document.getElementById('overlay').classList.remove('show');document.getElementById('orderPanel').classList.remove('show');document.getElementById('successToast').classList.add('show');}).catch(function(){var ta=document.createElement('textarea');ta.value=m;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);document.getElementById('overlay').classList.remove('show');document.getElementById('orderPanel').classList.remove('show');document.getElementById('successToast').classList.add('show');});}
function closeSuccess(){document.getElementById('successToast').classList.remove('show');var ks=Object.keys(cart);cart={};ks.forEach(function(k){updateUI(k);});}
renderMenu();updateCartBar();
</script>
</body>
</html>
