<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>整点烧烤 - 在线点餐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Microsoft YaHei',sans-serif;background:#f5e6d3;min-height:100vh;padding-bottom:80px}
.header{background:linear-gradient(135deg,#e85d00,#cc3300);padding:20px 16px 16px;text-align:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.header .brand{font-size:26px;font-weight:900;color:#fff;letter-spacing:3px}
.header .slogan{color:rgba(255,255,255,.85);font-size:12px;letter-spacing:2px;margin-top:2px}
.header .slogan .hot{color:#ffdd44}
.category{margin:10px 12px 6px}
.cat-header{display:flex;align-items:center;gap:8px;padding:8px 0 6px}
.cat-tag{background:linear-gradient(135deg,#e85d00,#cc3300);color:#fff;font-size:11px;font-weight:700;padding:2px 10px;border-radius:4px}
.cat-title{color:#8a4a2a;font-size:15px;font-weight:700}
.cat-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(200,120,60,.2),transparent)}
.menu-list{display:flex;flex-direction:column;gap:4px}
.menu-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#fffcf8;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.item-info .name{color:#4a2a1a;font-size:14px;font-weight:700}
.item-info .name .hot{color:#ff4400;font-size:12px;margin-right:2px}
.item-info .desc{color:#8a7a6a;font-size:11px;margin-top:1px}
.item-right{display:flex;align-items:center;gap:12px}
.item-price{color:#cc5500;font-size:16px;font-weight:900}
.item-price small{font-size:11px;font-weight:400;color:#996644}
.btn-group{display:flex;align-items:center;gap:6px}
.btn-minus,.btn-plus{width:28px;height:28px;border-radius:50%;border:none;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;user-select:none}
.btn-minus{background:#f0e0d0;color:#885533;border:1px solid #e0d0c0}
.btn-minus:active{background:#e0d0c0}
.btn-plus{background:linear-gradient(135deg,#e85d00,#cc3300);color:#fff;box-shadow:0 2px 6px rgba(200,50,0,.2)}
.btn-plus:active{transform:scale(0.93)}
.item-count{color:#4a2a1a;font-size:15px;font-weight:700;min-width:20px;text-align:center}
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:#2a1a0a;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,.3)}
.cart-left{display:flex;align-items:center;gap:10px;cursor:pointer}
.cart-icon-wrap{position:relative;width:44px;height:44px;background:rgba(255,255,255,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.cart-badge{position:absolute;top:-4px;right:-4px;background:#ff4400;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px}
.cart-info .total-label{color:#aa8866;font-size:11px}
.cart-info .total-price{color:#ffaa44;font-size:20px;font-weight:900}
.cart-info .total-price small{font-size:12px;font-weight:400;color:#aa7744}
.btn-order{background:linear-gradient(135deg,#ff6a00,#ff4400);color:#fff;border:none;padding:10px 24px;border-radius:20px;font-size:15px;font-weight:700;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 12px rgba(255,50,0,.3);transition:all .15s}
.btn-order:active{transform:scale(0.96)}
.btn-order:disabled{opacity:.4;box-shadow:none}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200}
.overlay.show{display:block}
.order-panel{position:fixed;bottom:0;left:0;right:0;max-height:60vh;background:#fffcf8;border-radius:20px 20px 0 0;z-index:201;transform:translateY(100%);transition:transform .3s ease;overflow-y:auto}
.order-panel.show{transform:translateY(0)}
.order-panel .handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:10px auto}
.order-panel .panel-title{text-align:center;font-size:16px;font-weight:700;color:#4a2a1a;padding-bottom:10px;border-bottom:1px solid #eee}
.order-list{padding:10px 16px}
.order-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5ede5}
.order-item .left .oname{color:#4a2a1a;font-size:14px;font-weight:700}
.order-item .left .oqty{color:#8a7a6a;font-size:12px}
.order-item .right{display:flex;align-items:center;gap:10px}
.order-item .right .oprice{color:#cc5500;font-size:14px;font-weight:700}
.order-total{display:flex;justify-content:space-between;padding:12px 16px 16px;border-top:1px solid #eee}
.order-total .tt{color:#4a2a1a;font-size:15px;font-weight:700}
.order-total .tp{color:#cc5500;font-size:20px;font-weight:900}
.order-total .tp small{font-size:12px;font-weight:400;color:#996644}
.panel-actions{display:flex;gap:10px;padding:0 16px 20px}
.panel-actions button{flex:1;padding:10px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.btn-clear{background:#f0e0d0;color:#885533}
.btn-clear:active{background:#e0d0c0}
.btn-submit{background:linear-gradient(135deg,#ff6a00,#ff4400);color:#fff}
.btn-submit:active{transform:scale(0.96)}

/* 订单成功弹窗 */
.order-success{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:16px;padding:24px;text-align:center;z-index:202;box-shadow:0 20px 60px rgba(0,0,0,.3);min-width:300px;max-width:90%}
.order-success.show{display:block}
.os-header{font-size:20px;font-weight:900;color:#cc3300;margin-bottom:10px}
.os-content{background:#f5ede5;border-radius:10px;padding:14px;font-size:14px;line-height:1.8;text-align:left;color:#4a2a1a;white-space:pre-wrap;word-break:break-all;margin:0;max-height:300px;overflow-y:auto}
.os-footer{margin-top:12px}
.os-phone{color:#0f5aad;font-size:16px;font-weight:700;margin-bottom:4px}
.os-tip{color:#8a7a6a;font-size:12px;margin-bottom:10px}
.btn-ok{background:linear-gradient(135deg,#e85d00,#cc3300);color:#fff;border:none;padding:8px 32px;border-radius:16px;font-size:14px;font-weight:700;cursor:pointer}
.btn-ok:active{transform:scale(0.96)}

/* 推送状态提示 */
.push-status{font-size:11px;color:#8a7a6a;margin-top:4px;min-height:16px}
.push-status.ok{color:#22a855}
.push-status.fail{color:#cc3300}

@media (max-width:380px){
.menu-item{padding:8px 12px}
.item-info .name{font-size:13px}
}
</style>
</head>
<body>

<!-- 头部 -->
<div class="header">
  <div class="brand">🔥 整点烧烤</div>
  <div class="slogan"><span class="hot">❗</span> 整点小烧烤 · 快乐没烦恼</div>
</div>

<!-- 菜单容器 -->
<div id="menuContainer"></div>

<!-- 底部购物车栏 -->
<div class="cart-bar">
  <div class="cart-left" onclick="toggleCart()">
    <div class="cart-icon-wrap">
      🛒
      <div class="cart-badge" id="cartBadge" style="display:none">0</div>
    </div>
    <div class="cart-info">
      <div class="total-label">合计</div>
      <div class="total-price" id="cartTotal">0<small>元</small></div>
    </div>
  </div>
  <button class="btn-order" id="btnOrder" onclick="submitOrder()" disabled>去下单</button>
</div>

<!-- 遮罩 -->
<div class="overlay" id="overlay" onclick="toggleCart()"></div>

<!-- 购物车面板 -->
<div class="order-panel" id="orderPanel">
  <div class="handle"></div>
  <div class="panel-title">🛒 购物车</div>
  <div class="order-list" id="orderList"></div>
  <div class="order-total">
    <span class="tt">合计</span>
    <span class="tp" id="panelTotal">0<small>元</small></span>
  </div>
  <div class="panel-actions">
    <button class="btn-clear" onclick="clearCart()">清空 🗑</button>
    <button class="btn-submit" onclick="submitOrder()">提交订单</button>
  </div>
</div>

<!-- 订单成功弹窗 -->
<div class="order-success" id="orderSuccess">
  <div class="os-header">🎉 新订单</div>
  <pre class="os-content" id="orderResult"></pre>
  <div class="push-status" id="pushStatus"></div>
  <div class="os-footer">
    <div class="os-phone">📞 花花 15840015715</div>
    <div class="os-tip">把手机给老板娘看，直接接单！</div>
    <button class="btn-ok" onclick="closeOrder()">完成接单 ✅</button>
  </div>
</div>

<script>
// ====== 菜单数据 ======
const menuData = [
  { cat: '🔥 招牌必点', items: [
    { name: '尖椒虾滑', price: 5, unit: '串', hot: false },
    { name: '大油边', price: 20, unit: '串', tag: '不定时有' }
  ]},
  { cat: '🥩 牛羊肉(5串起)', subtitle: '牛羊肉5串起', items: [
    { name: '牛肉', price: 2, unit: '串' },
    { name: '羊肉', price: 2, unit: '串' },
    { name: '猪肉串', price: 1, unit: '串' },
    { name: '瘦牛', price: 3, unit: '串' },
    { name: '生筋', price: 3, unit: '串', hot: true },
    { name: '油边', price: 5, unit: '串', hot: true },
    { name: '排骨串', price: 3, unit: '串', hot: true },
    { name: '五花肉卷金针菇', price: 3, unit: '串' }
  ]},
  { cat: '💰 2元区', subtitle: '实惠走量', items: [
    { name: '菜卷(金针菇/香菜)', price: 2, unit: '串' },
    { name: '辣椒', price: 2, unit: '串' },
    { name: '鱼丸', price: 2, unit: '串' },
    { name: '鱼豆腐', price: 2, unit: '串' },
    { name: '实蛋', price: 2, unit: '串' },
    { name: '小腰', price: 2, unit: '串' },
    { name: '熟筋', price: 2, unit: '串' },
    { name: '板筋', price: 2, unit: '串' },
    { name: '面筋', price: 2, unit: '串' },
    { name: '鸡肉肠', price: 2, unit: '串' },
    { name: '鸡胗', price: 2, unit: '串' }
  ]},
  { cat: '💰 3元区', subtitle: '人气必点', items: [
    { name: '鸡皮', price: 3, unit: '串' },
    { name: '鸡脆骨', price: 3, unit: '串' },
    { name: '筋皮', price: 3, unit: '串' },
    { name: '棒鱼', price: 3, unit: '串' },
    { name: '蚂蚱', price: 3, unit: '串' },
    { name: '羊脖筋', price: 3, unit: '串' },
    { name: '粉肠', price: 3, unit: '串' },
    { name: '烤饼', price: 3, unit: '串' }
  ]},
  { cat: '🥬 素菜', subtitle: '按把/按拍', items: [
    { name: '韭菜', price: 5, unit: '拍' },
    { name: '玉米粒', price: 5, unit: '把' },
    { name: '豆皮', price: 5, unit: '把' }
  ]},
  { cat: '💰 4元+', subtitle: '精品系列', items: [
    { name: '心管', price: 4, unit: '串' },
    { name: '风干肠', price: 4, unit: '串' },
    { name: '宫后夹肉', price: 4, unit: '串' },
    { name: '鸡翅', price: 8, unit: '串' }
  ]}
];

// ====== 购物车 ======
let cart = {};

// ====== 渲染菜单 ======
function renderMenu() {
  const c = document.getElementById('menuContainer');
  c.innerHTML = '';
  menuData.forEach(cat => {
    if (!cat.items) return;
    const s = document.createElement('div');
    s.className = 'category';
    let subHtml = cat.subtitle ? `<span class="cat-title" style="font-size:11px;color:#887766;">${cat.subtitle}</span>` : '';
    s.innerHTML = `
      <div class="cat-header">
        <div class="cat-tag">${cat.cat.split(' ')[0]}</div>
        <div class="cat-title">${cat.cat.split(' ').slice(1).join(' ') || cat.cat}</div>
        ${subHtml}
        <div class="cat-line"></div>
      </div>
      <div class="menu-list">
        ${cat.items.map((item, idx) => {
          const key = cat.cat + '_' + idx;
          const cnt = cart[key] || 0;
          const hotHtml = item.hot ? '<span class="hot">❗</span>' : '';
          const tagHtml = item.tag ? `<span style="font-size:10px;color:#ff6633;border:1px solid rgba(255,102,51,0.3);padding:0 5px;border-radius:2px;margin-left:3px;white-space:nowrap">${item.tag}</span>` : '';
          return `
            <div class="menu-item">
              <div class="item-info">
                <div class="name">${hotHtml}${item.name}${tagHtml}</div>
                <div class="desc">${item.price}元/${item.unit}</div>
              </div>
              <div class="item-right">
                <div class="item-price">${item.price}<small>元</small></div>
                <div class="btn-group">
                  <button class="btn-minus" onclick="changeQty('${key}',-1)">−</button>
                  <span class="item-count" id="count_${key}">${cnt || ''}</span>
                  <button class="btn-plus" onclick="changeQty('${key}',1)">+</button>
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
    c.appendChild(s);
  });
}

// ====== 数量操作 ======
function changeQty(key, delta) {
  const item = findItem(key);
  if (!item) return;
  const cur = cart[key] || 0;
  const n = Math.max(0, cur + delta);
  if (n === 0) {
    delete cart[key];
  } else {
    cart[key] = n;
  }
  updateUI(key);
}

function findItem(key) {
  const [catTitle, idx] = key.split('_');
  const cat = menuData.find(c => c.cat === catTitle);
  return cat ? cat.items[parseInt(idx)] : null;
}

// ====== UI更新 ======
function updateUI(key) {
  const el = document.getElementById('count_' + key);
  if (el) el.textContent = cart[key] || '';
  updateCartBar();
  updateOrderPanel();
}

function updateCartBar() {
  const total = getTotal();
  const count = getCount();
  document.getElementById('cartTotal').innerHTML = total + '<small>元</small>';
  const badge = document.getElementById('cartBadge');
  badge.style.display = count > 0 ? 'flex' : 'none';
  badge.textContent = count;
  document.getElementById('btnOrder').disabled = count === 0;
}

function getTotal() {
  let t = 0;
  for (const k in cart) {
    const item = findItem(k);
    if (item) t += item.price * cart[k];
  }
  return t;
}

function getCount() {
  let n = 0;
  for (const k in cart) n += cart[k];
  return n;
}

// ====== 购物车面板 ======
function toggleCart() {
  const panel = document.getElementById('orderPanel');
  const overlay = document.getElementById('overlay');
  if (panel.classList.contains('show')) {
    panel.classList.remove('show');
    overlay.classList.remove('show');
  } else if (getCount() > 0) {
    panel.classList.add('show');
    overlay.classList.add('show');
    updateOrderPanel();
  }
}

function updateOrderPanel() {
  const list = document.getElementById('orderList');
  const total = getTotal();
  document.getElementById('panelTotal').innerHTML = total + '<small>元</small>';
  
  if (getCount() === 0) {
    list.innerHTML = '<div style="text-align:center;padding:30px 0;color:#8a7a6a;font-size:14px;">购物车空空如也 🛒</div>';
    return;
  }
  
  let html = '';
  for (const k in cart) {
    const item = findItem(k);
    if (item) {
      html += `
        <div class="order-item">
          <div class="left">
            <div class="oname">${item.name}</div>
            <div class="oqty">${cart[k]}${item.unit} × ${item.price}元</div>
          </div>
          <div class="right">
            <div class="oprice">${item.price * cart[k]}元</div>
            <button class="btn-minus" onclick="changeQty('${k}',-1)">−</button>
          </div>
        </div>
      `;
    }
  }
  list.innerHTML = html;
}

function clearCart() {
  const keys = Object.keys(cart);
  cart = {};
  keys.forEach(k => updateUI(k));
  toggleCart();
}

// ====== 提交订单 ======
function submitOrder() {
  if (getCount() === 0) return;
  
  // 关闭面板
  document.getElementById('orderPanel').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
  
  // 生成订单文本
  const d = new Date();
  const time = (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
  let msg = time + '\n';
  msg += '━━━━━━━━━━━━━━━━\n';
  const items = [];
  for (const k in cart) {
    const item = findItem(k);
    if (item) {
      items.push({ name: item.name, qty: cart[k], unit: item.unit, price: item.price, subtotal: item.price * cart[k] });
      msg += item.name + ' × ' + cart[k] + ' = ' + (item.price * cart[k]) + '元\n';
    }
  }
  msg += '━━━━━━━━━━━━━━━━\n';
  msg += '💰 合计：' + getTotal() + '元';
  
  // 显示订单
  document.getElementById('orderResult').textContent = msg;
  document.getElementById('orderSuccess').classList.add('show');
  
  // 复制到剪贴板
  navigator.clipboard.writeText(msg + '\n\n📞 花花 15840015715').catch(() => {});
  
  // === PushPlus推送token（内嵌在页面，用于直接推送） ===
  const PUSH_TOKEN = '16c319199aa4404c97baefb12dcd6a4b';
  const pushStatus = document.getElementById('pushStatus');
  pushStatus.textContent = '⏳ 正在推送微信通知...';
  pushStatus.className = 'push-status';
  
  const orderData = {
    token: PUSH_TOKEN,
    title: '🔥 整点烧烤 - 新订单 ¥' + getTotal(),
    content: msg + '\n\n📞 15840015715',
    template: 'txt'
  };
  
  // 方法1：先尝试本地服务器推送（当顾客通过本地服务器访问时）
  fetch('/api/order', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      time: time,
      items: items.map(i => ({
        name: i.name,
        qty: i.qty,
        subtotal: i.subtotal
      })),
      total: getTotal()
    })
  })
  .then(r => r.json())
  .then(data => {
    if (data.pushed) {
      pushStatus.textContent = '✅ 微信已通知，请查收！';
      pushStatus.className = 'push-status ok';
    } else {
      throw new Error('push failed');
    }
  })
  .catch(() => {
    // 方法2：本地服务器不可用，直接浏览器推送到PushPlus
    fetch('https://www.pushplus.plus/send', {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(orderData)
    }).catch(() => {});
    // no-cors模式下无法读取结果，但请求已发出
    setTimeout(() => {
      pushStatus.textContent = '📋 订单已复制，请发给花花微信';
      pushStatus.className = 'push-status';
    }, 1500);
  });
}

function closeOrder() {
  document.getElementById('orderSuccess').classList.remove('show');
  const keys = Object.keys(cart);
  cart = {};
  keys.forEach(k => updateUI(k));
}

// ====== 初始化 ======
renderMenu();
updateCartBar();
</script>
</body>
</html>
